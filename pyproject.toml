[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-forwarder"
version = "0.5.0"
description = "Telegram channel message forwarder with Telethon listener and aiogram publisher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0,<4",
    "telethon>=1.36.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.2",
    "asyncpg>=0.30.0,<1",
    "redis>=5.2.0,<7",
    "dbus-next>=0.2.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-aiofiles",
    "types-PyYAML",
]

[project.scripts]
tg-forwarder = "app.main:main"
tg-forwarder-web = "app.entrypoints.web:main"
tg-forwarder-sender = "app.entrypoints.sender:main"
tg-forwarder-telegram-receiver = "app.entrypoints.telegram_receiver:main"
tg-forwarder-safew-receiver = "app.entrypoints.safew_receiver:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "ASYNC240", "ASYNC250"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC250", "T201"]
"tests/*" = ["B017"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["app"]
exclude = ["migrations", "tests"]

[[tool.mypy.overrides]]
module = ["telethon.*", "jose.*", "pwdlib.*", "redis.*", "dbus_next.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.listeners.telegram_listener"]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["app.listeners.freedesktop_notifications"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
